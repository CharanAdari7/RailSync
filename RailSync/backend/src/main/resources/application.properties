spring.application.name=railsync-backend

server.port=8080

spring.datasource.url=${RAILSYNC_DB_URL:jdbc:postgresql://localhost:5432/railsync}
spring.datasource.username=${RAILSYNC_DB_USERNAME:postgres}
spring.datasource.password=${RAILSYNC_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
