services:
  postgres:
    image: postgres:17
    container_name: railsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: railsync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - railsync-postgres-data:/var/lib/postgresql/data

volumes:
  railsync-postgres-data:
